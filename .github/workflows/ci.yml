name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run knip
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chief-of-staff-demo/tests test -- --coverage
      - name: Add coverage to the job summary
        if: always()
        run: |
          if [[ -f coverage/coverage-summary.txt ]]; then
            {
              echo "## Server unit coverage"
              echo '```text'
              cat coverage/coverage-summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @chief-of-staff-demo/tests exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm --filter @chief-of-staff-demo/tests test:e2e -- --reporter=html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: install -d -m 0777 workspace
      - run: docker compose up -d
      - name: Wait for the health endpoint
        run: |
          for attempt in {1..30}; do
            if response="$(curl --fail --silent http://127.0.0.1:4317/api/health)" && [[ "$response" == '{"ok":true}' ]]; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - if: always()
        run: docker compose down
