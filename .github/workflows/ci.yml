name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Out-of-band vendor token: the scan fails if this is missing or empty.
      BANNED_VENDOR_TOKEN: ${{ secrets.BANNED_VENDOR_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, golden, contract, and failure tests (replay mode, no network)
        run: npm test
      - name: Build static UI
        env:
          VITE_UI_COMMIT_SHA: ${{ github.sha }}
        run: npm run build


      - name: Banned-token scan (production build)
        run: npm run scan:banned -- apps/web/dist

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: UI end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
