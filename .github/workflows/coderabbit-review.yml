name: CodeRabbit review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# CodeRabbit skips automatic reviews on a public repository with fewer than ten
# stars and reviews only on an explicit `@coderabbitai review`; it also ignores
# that command when a bot posts it (measured on #386: nothing from a
# github-actions comment, a reply in six seconds from a user's). So the comment
# has to come from a user token: CODERABBIT_TRIGGER_TOKEN, a fine-grained PAT
# with pull-requests: write on this repository. Without the secret the job
# reports why and does nothing.
permissions: {}

jobs:
  request-review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask CodeRabbit to review the current head
        env:
          GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::CODERABBIT_TRIGGER_TOKEN is not set; CodeRabbit ignores a bot-posted trigger, so ask it by hand: comment '@coderabbitai review' on the PR."
            exit 0
          fi
          gh pr comment "$PR_URL" --body "@coderabbitai review"
