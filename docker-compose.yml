services:
  app:
    build: .
    # 127.0.0.1 on the left is load-bearing: without it Docker publishes on all
    # host interfaces and an app with no authentication (ADR-0001) is reachable
    # from the network. 4317 on the right must match the registered Google
    # OAuth redirect URI.
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      RELAY_BASE_URL: http://relay:4318
    depends_on:
      relay:
        condition: service_healthy
    volumes:
      - ./workspace:/app/workspace
    # Deliberately not `unless-stopped`: that restarts the app every time Docker
    # Desktop starts, for as long as the image exists, which is not what someone
    # trying the app out expects of it. Starting it is `docker compose up -d`.
    restart: "no"
    # `docker compose up --build --watch` is the code-editing loop: the whole
    # loop stays inside Docker, so there is no native way to run the app and no
    # second port to register with Google. `rebuild` and not `sync`, because the
    # runtime image holds only build output — there is no source in it to sync
    # onto, and both the server and the web bundle are compiled.
    develop:
      watch:
        - action: rebuild
          path: ./apps/server
          ignore: [dist, node_modules]
        - action: rebuild
          path: ./apps/web
          ignore: [dist, node_modules]
        - action: rebuild
          path: ./packages/shared
          ignore: [dist, node_modules]
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json
        - action: rebuild
          path: ./tsconfig.base.json
        - action: rebuild
          path: ./Dockerfile
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    ports:
      - "127.0.0.1:4318:4318"
    restart: "no"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4318/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
